[platformio]
src_dir = src

[env:edith-test]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
upload_port = COM5
upload_speed = 115200
monitor_port = COM5
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
  adafruit/Adafruit BMP280 Library@2.6.8
  adafruit/Adafruit MPU6050@2.2.6
  adafruit/DHT sensor library@1.4.6

